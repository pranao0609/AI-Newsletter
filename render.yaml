databases:
  - name: ai-news-aggregator-db
    databaseName: ai_news_aggregator
    user: ai_news_user
    plan: free

services:
  - type: web
    name: ai-news-aggregator
    runtime: python
    plan: free
    numInstances: 1

    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn app.web:app --host 0.0.0.0 --port 10000"

    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: ai-news-aggregator-db
          property: connectionString

      - key: GROQ_API_KEY
        sync: false

      - key: MY_EMAIL
        sync: false

      - key: APP_PASSWORD
        sync: false

      - key: CRON_SECRET
        generateValue: true

      - key: POSTGRES_USER
        fromDatabase:
          name: ai-news-aggregator-db
          property: user

      - key: POSTGRES_PASSWORD
        fromDatabase:
          name: ai-news-aggregator-db
          property: password

      - key: POSTGRES_HOST
        fromDatabase:
          name: ai-news-aggregator-db
          property: host

      - key: POSTGRES_PORT
        fromDatabase:
          name: ai-news-aggregator-db
          property: port

      - key: POSTGRES_DB
        fromDatabase:
          name: ai-news-aggregator-db
          property: database
