services:
  # PostgreSQL Database
  - type: pserv
    name: ai-news-db
    env: docker
    plan: free
    region: oregon
    ipAllowList: []
    databases:
      - name: ai_news_aggregator
        user: ai_news_user

  # Cron Job Service (runs daily)
  - type: cron
    name: ai-news-aggregator
    env: docker
    plan: free
    region: oregon
    schedule: "0 9 * * *"  # Runs daily at 9 AM UTC
    dockerfilePath: ./Dockerfile
    dockerContext: .
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.8
      - key: GROQ_API_KEY
        sync: false
      - key: MY_EMAIL
        sync: false
      - key: APP_PASSWORD
        sync: false
      - key: POSTGRES_USER
        fromDatabase:
          name: ai-news-db
          property: user
      - key: POSTGRES_PASSWORD
        fromDatabase:
          name: ai-news-db
          property: password
      - key: POSTGRES_HOST
        fromDatabase:
          name: ai-news-db
          property: host
      - key: POSTGRES_PORT
        fromDatabase:
          name: ai-news-db
          property: port
      - key: POSTGRES_DB
        fromDatabase:
          name: ai-news-db
          property: database
