databases:
  - name: ai-news-db
    databaseName: ai_news_aggregator
    user: ai_news_user
    plan: free
    region: oregon

services:
  - type: cron
    name: ai-news-aggregator
    runtime: docker
    plan: free
    region: oregon
    schedule: "0 9 * * *"
    dockerfilePath: ./Dockerfile
    dockerContext: .

    envVars:
      - key: PYTHON_VERSION
        value: "3.11.8"

      - key: GROQ_API_KEY
        sync: false

      - key: MY_EMAIL
        sync: false

      - key: APP_PASSWORD
        sync: false

      - key: POSTGRES_USER
        fromDatabase:
          name: ai-news-db
          property: user

      - key: POSTGRES_PASSWORD
        fromDatabase:
          name: ai-news-db
          property: password

      - key: POSTGRES_HOST
        fromDatabase:
          name: ai-news-db
          property: host

      - key: POSTGRES_PORT
        fromDatabase:
          name: ai-news-db
          property: port

      - key: POSTGRES_DB
        fromDatabase:
          name: ai-news-db
          property: database
