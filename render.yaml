databases:
  - name: ai-news-aggregator-db
    databaseName: ai_news_aggregator
    user: ai_news_user
    plan: free

services:
  - type: cron
    name: daily-digest-job
    runtime: python
    plan: free
    env: docker
    dockerfilePath: ./Dockerfile
    schedule: "0 9 * * *"  # Run daily at 9 AM UTC
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: ai-news-aggregator-db
          property: connectionString
      - key: GROQ_API_KEY
        sync: false
      - key: MY_EMAIL
        sync: false
      - key: APP_PASSWORD
        sync: false
      - key: POSTGRES_USER
        fromDatabase:
          name: ai-news-aggregator-db
          property: user
      - key: POSTGRES_PASSWORD
        fromDatabase:
          name: ai-news-aggregator-db
          property: password
      - key: POSTGRES_HOST
        fromDatabase:
          name: ai-news-aggregator-db
          property: host
      - key: POSTGRES_PORT
        fromDatabase:
          name: ai-news-aggregator-db
          property: port
      - key: POSTGRES_DB
        fromDatabase:
          name: ai-news-aggregator-db
          property: database
